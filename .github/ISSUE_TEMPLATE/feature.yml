name: Feature request
description: Suggest something ClinLit AI should do.
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Don't include anything confidential to your organisation.
  - type: textarea
    id: need
    attributes:
      label: What you're trying to do
      description: The task or question you have, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like ClinLit AI to handle it.
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A question you'd ask, or a data source or output you'd want.
