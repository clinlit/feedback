name: Bug report
description: Something in the app or the site doesn't work.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public.** Don't include personal health information or anything confidential to your organisation.
        For a wrong *answer*, use the "Wrong or incomplete answer" form instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include any error message shown.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Chat app (clinlit.com/app)
        - Website (clinlit.com)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on macOS, Safari on iPhone
  - type: input
    id: when
    attributes:
      label: When it happened
      description: Date and approximate time, with your time zone.
      placeholder: 2026-10-08 14:30 PDT
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Optional. Drag an image here. Check it shows nothing confidential first.
